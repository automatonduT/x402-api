<style>body{font-family:system-ui;background:#0b0e14;color:#e6e6e6;margin:2rem;max-width:760px}
a{color:#60a5fa}table{border-collapse:collapse;width:100%;margin-top:1rem}

<h1>Live Funding Rates Desk</h1>
<p>Taux de funding perp réels (Binance fapi, toutes les 8h). Éligibilité carry: ENTRÉE si ≥ 0.01%/8h,
SORTIE si &lt; 0.002% — voir <a href="/tools/tradelab/carry">le système CARRY</a>.
Docs agents: <a href="/llms-full.txt">llms-full.txt</a> · <a href="/desk.html">Market desk</a> · <em>SIMULATION ONLY</em></p>
<table id=t><thead><tr><th>Symbole</th><th>Mark</th><th>Funding %/8h</th><th>Annualisé %</th><th>Carry</th></tr></thead><tbody><tr><td colspan=5>chargement…</td></tr></tbody></table>
<p id=u></p>
<script>
const S=["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT"];
async function go(){try{
const r=await fetch("/tools/tradelab/funding?symbols="+S.join(","));const j=await r.json();
document.querySelector("#t tbody").innerHTML=j.funding.map(f=>f.error?
"<tr><td>"+f.symbol+"</td><td colspan=4>"+f.error+"</td></tr>":
"<tr><td>"+f.symbol+"</td><td>"+f.markPrice.toLocaleString()+"</td><td>"+f.fundingPct8h+"</td><td>"+f.annualizedIfAlwaysIn+"</td><td class="+(f.carryEligible==="ENTER"?"ok":"wait")+">"+f.carryEligible+"</td></tr>").join("");
document.getElementById("u").textContent="maj "+new Date(j.asOf).toLocaleString()+" · éligibles maintenant: "+(j.carryEligibleNow.join(", ")||"aucun");
}catch(e){document.getElementById("u").textContent="erreur: "+e}}
go();setInterval(go,300000);
</script></body></html>
