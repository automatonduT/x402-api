body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,sans-serif;max-width:880px;margin:0 auto;padding:24px 16px}
h1{font-size:1.35rem}.top{font-size:.85rem;margin-bottom:10px}a{color:#58a6ff;text-decoration:none}

<div class="top"><a href="/">&larr; micro-tools</a> · <a href="/EMBED-KIT.md">EMBED-KIT.md</a> · <a href="/widgets.json">widgets.json</a></div>
<h1>Widget Builder — point, click, paste</h1>
<div class="tabs" id="tabs"></div>
<div id="form"></div>
<div class="preview"><img id="pv" alt="preview"></div>
<textarea id="snip" readonly></textarea><br>
<button onclick="navigator.clipboard.writeText(document.getElementById('snip').value);this.textContent='copied!'">copy HTML</button>
<p class="hint">Every render accepts <code>&amp;ref=yourname</code> — your source lands in our inbound log (<a href="/blog9">measurement contract</a>).<br>
Market widgets are SIM: real Binance data, not financial advice. Ledger: <a href="/ledger.md">ledger.md</a>.</p>
<script>
var W={
 spark:{path:"/spark.svg",f:[["data","numbers","1,3,2,5,7,4,8"],["color","hex","22c55e"],["w","","180"],["h","","44"]]},
 bars:{path:"/bars.svg",f:[["pairs","name=value …","alpha=5 beta=12 gamma=8"],["labels","labels","alpha,beta,gamma"],["w","","260"],["h","","100"]]},
 card:{path:"/card.svg",f:[["title","title","deploy"],["value","value","passing"],["sub","sub","v1.15"],["color","hex","238636"]]},
 heat:{path:"/tools/market/heat.svg",f:[["symbols","symbols","BTCUSDT,ETHUSDT,SOLUSDT"],["w","","320"]]},
 equity:{path:"/tools/market/equity.svg",f:[]},
 regime:{path:"/tools/market/regime.svg",f:[["symbols","symbols","BTCUSDT,ETHUSDT,SOLUSDT"],["w","","340"]]}
};
var cur="spark";
function esc(s){return String(s).replace(/&(?!(amp|lt|gt|#\\d+);)/g,"&amp;").replace(/"/g,"&quot;")}
function tabs(){var t=document.getElementById("tabs");t.innerHTML="";
 Object.keys(W).forEach(function(k){var d=document.createElement("div");d.className="tab"+(k===cur?" on":"");d.textContent=k.replace(".svg","");
 d.onclick=function(){cur=k;build();};t.appendChild(d);});}
function build(){
 var f=document.getElementById("form");f.innerHTML="";
 var lab=document.createElement("label");lab.textContent="ref (your name) ";
 var ri=document.createElement("input");ri.id="in_ref";ri.value="widget-builder";lab.appendChild(ri);f.appendChild(lab);
 W[cur].f.forEach(function(row){var l=document.createElement("label");l.textContent=row[1]+" ";
  var i=document.createElement("input");i.id="in_"+row[0];i.value=row[2];i.oninput=upd;l.appendChild(i);f.appendChild(l);});
 upd();}
function upd(){
 var parts=[],ref=(document.getElementById("in_ref")||{}).value||"widget-builder";
 W[cur].f.forEach(function(row){var el=document.getElementById("in_"+row[0]);if(!el)return;
  var v=el.value.trim();if(!v)return;
  if(row[0]==="pairs"){v.split(/\\s+/).forEach(function(p){var kv=p.split("=");if(kv.length===2)parts.push(encodeURIComponent(kv[0])+"="+encodeURIComponent(kv[1]));});}
  else parts.push(row[0]+"="+encodeURIComponent(v));});
 parts.push("ref="+encodeURIComponent(ref));
 var url=location.origin+W[cur].path+"?"+parts.join("&");
 document.getElementById("pv").src=url;
 document.getElementById("snip").value='<img src="'+url+'" alt="micro-tools widget">';
}
tabs();build();
</script></body></html>
